<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180">
  <defs>
    <style>
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 700; fill: #172435; }
      .meta { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #637283; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #516172; text-anchor: middle; }
      .tile { fill: #ffffff; }
      .sun { fill: #ffc83d; }
      .sun-ray { stroke: #ffc83d; stroke-width: 5.5; stroke-linecap: round; }
      .moon { fill: #8197ff; }
      .star { fill: #b7c4ff; }
      .cloud-light { fill: #eef4fa; }
      .cloud-mid { fill: #d9e3ee; }
      .cloud-dark { fill: #9eabba; }
      .rain { stroke: #49a8ff; stroke-width: 6; stroke-linecap: round; }
      .rain-heavy { stroke: #268cf5; stroke-width: 6.5; stroke-linecap: round; }
      .snow { stroke: #80ccff; stroke-width: 4.5; stroke-linecap: round; }
      .mist { stroke: #a9b6c4; stroke-width: 6; stroke-linecap: round; }
      .wind-a { stroke: #90a3b6; stroke-width: 7; stroke-linecap: round; fill: none; }
      .wind-b { stroke: #57bbf1; stroke-width: 7; stroke-linecap: round; fill: none; }
      .bolt { fill: #ffb329; }
    </style>

    <g id="sun-flat">
      <circle cx="48" cy="48" r="23" class="sun"/>
      <g class="sun-ray">
        <path d="M48 9v10"/><path d="M48 77v10"/><path d="M9 48h10"/><path d="M77 48h10"/>
        <path d="M20.5 20.5l7 7"/><path d="M68.5 68.5l7 7"/><path d="M75.5 20.5l-7 7"/><path d="M27.5 68.5l-7 7"/>
      </g>
    </g>

    <g id="moon-flat">
      <path d="M68 69c-21 8-45-8-45-32 0-15 9-28 22-34-4 20 10 39 30 43 4 1 8 1 12 0-3 10-10 18-19 23z" class="moon"/>
      <circle cx="63" cy="24" r="3" class="star"/>
      <circle cx="78" cy="37" r="2.5" class="star"/>
    </g>

    <g id="cloud-light-flat">
      <path d="M26 68c-10 0-18-8-18-18 0-8 6-15 14-17 5-12 16-19 29-19 14 0 27 10 30 24 8 2 14 9 14 18 0 7-4 12-9 15-3 2-7 3-11 3H26z" class="cloud-light"/>
    </g>

    <g id="cloud-mid-flat">
      <path d="M26 68c-10 0-18-8-18-18 0-8 6-15 14-17 5-12 16-19 29-19 14 0 27 10 30 24 8 2 14 9 14 18 0 7-4 12-9 15-3 2-7 3-11 3H26z" class="cloud-mid"/>
    </g>

    <g id="cloud-dark-flat">
      <path d="M26 68c-10 0-18-8-18-18 0-8 6-15 14-17 5-12 16-19 29-19 14 0 27 10 30 24 8 2 14 9 14 18 0 7-4 12-9 15-3 2-7 3-11 3H26z" class="cloud-dark"/>
    </g>

    <g id="rain-three" class="rain">
      <path d="M35 76l-9 17"/><path d="M54 80l-9 17"/><path d="M73 76l-9 17"/>
    </g>

    <g id="rain-four" class="rain-heavy">
      <path d="M28 76l-10 20"/><path d="M46 82l-10 20"/><path d="M64 76l-10 20"/><path d="M82 82l-10 20"/>
    </g>

    <g id="rain-two" class="rain">
      <path d="M31 82l-8 15"/><path d="M78 82l-8 15"/>
    </g>

    <g id="flake" class="snow">
      <path d="M0-9v18"/><path d="M-8-4l16 8"/><path d="M8-4l-16 8"/>
    </g>

    <g id="icon-clear-day"><use href="#sun-flat"/></g>
    <g id="icon-clear-night"><use href="#moon-flat"/></g>
    <g id="icon-partly-day">
      <g transform="translate(2 0) scale(.72)"><use href="#sun-flat"/></g>
      <g transform="translate(10 19) scale(.88)"><use href="#cloud-light-flat"/></g>
    </g>
    <g id="icon-partly-night">
      <g transform="translate(4 0) scale(.76)"><use href="#moon-flat"/></g>
      <g transform="translate(10 19) scale(.88)"><use href="#cloud-light-flat"/></g>
    </g>
    <g id="icon-cloudy"><use href="#cloud-light-flat"/></g>
    <g id="icon-overcast">
      <g transform="translate(-1 9) scale(.86)"><use href="#cloud-mid-flat"/></g>
      <g transform="translate(10 20) scale(.88)"><use href="#cloud-dark-flat"/></g>
    </g>
    <g id="icon-drizzle">
      <use href="#cloud-light-flat"/>
      <g class="rain" stroke-width="5"><path d="M38 78l-7 13"/><path d="M58 81l-7 13"/><path d="M76 78l-7 13"/></g>
    </g>
    <g id="icon-rain">
      <use href="#cloud-light-flat"/>
      <use href="#rain-three"/>
    </g>
    <g id="icon-heavy-rain">
      <use href="#cloud-dark-flat"/>
      <use href="#rain-four"/>
    </g>
    <g id="icon-thunder">
      <use href="#cloud-dark-flat"/>
      <path d="M53 54 39 78h13l-7 20 25-31H57l8-13z" class="bolt"/>
    </g>
    <g id="icon-thunder-rain">
      <use href="#cloud-dark-flat"/>
      <path d="M55 54 43 74h11l-6 18 22-29H59l7-9z" class="bolt"/>
      <use href="#rain-two"/>
    </g>
    <g id="icon-sleet">
      <use href="#cloud-light-flat"/>
      <g class="rain"><path d="M32 82l-8 15"/><path d="M78 82l-8 15"/></g>
      <g transform="translate(52 88)"><use href="#flake"/></g>
    </g>
    <g id="icon-snow">
      <use href="#cloud-light-flat"/>
      <g transform="translate(31 80)"><use href="#flake"/></g>
      <g transform="translate(52 88)"><use href="#flake"/></g>
      <g transform="translate(73 80)"><use href="#flake"/></g>
    </g>
    <g id="icon-heavy-snow">
      <use href="#cloud-dark-flat"/>
      <g transform="translate(27 78) scale(1.08)"><use href="#flake"/></g>
      <g transform="translate(50 90) scale(1.08)"><use href="#flake"/></g>
      <g transform="translate(73 78) scale(1.08)"><use href="#flake"/></g>
    </g>
    <g id="icon-fog">
      <use href="#cloud-light-flat"/>
      <g class="mist">
        <path d="M18 78h62"/><path d="M29 90h48"/><path d="M16 102h67"/>
      </g>
    </g>
    <g id="icon-haze">
      <circle cx="35" cy="34" r="16" class="sun" opacity=".72"/>
      <g class="mist">
        <path d="M18 52h62"/><path d="M29 65h49"/><path d="M16 78h67"/><path d="M31 91h42"/>
      </g>
    </g>
    <g id="icon-wind">
      <path d="M18 31h45c8 0 12-5 12-10 0-7-6-12-13-12-5 0-9 3-11 7" class="wind-a"/>
      <path d="M12 52h62c8 0 13 5 13 12s-6 13-14 13c-6 0-11-3-14-8" class="wind-b"/>
      <path d="M23 73h26" class="wind-a"/>
    </g>

    <g id="tile-clear-day"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-clear-day" x="44" y="26"/><text x="92" y="154" class="label" font-size="17">Clear Day</text></g>
    <g id="tile-clear-night"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-clear-night" x="44" y="26"/><text x="92" y="154" class="label" font-size="17">Clear Night</text></g>
    <g id="tile-partly-day"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-partly-day" x="44" y="26"/><text x="92" y="154" class="label" font-size="17">Partly Day</text></g>
    <g id="tile-partly-night"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-partly-night" x="44" y="26"/><text x="92" y="154" class="label" font-size="17">Partly Night</text></g>
    <g id="tile-cloudy"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-cloudy" x="44" y="26"/><text x="92" y="154" class="label" font-size="17">Cloudy</text></g>
    <g id="tile-overcast"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-overcast" x="44" y="26"/><text x="92" y="154" class="label" font-size="17">Overcast</text></g>
    <g id="tile-drizzle"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-drizzle" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Drizzle</text></g>
    <g id="tile-rain"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-rain" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Rain</text></g>
    <g id="tile-heavy-rain"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-heavy-rain" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Heavy Rain</text></g>
    <g id="tile-thunder"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-thunder" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Thunder</text></g>
    <g id="tile-thunder-rain"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-thunder-rain" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Storm Rain</text></g>
    <g id="tile-sleet"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-sleet" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Sleet</text></g>
    <g id="tile-snow"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-snow" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Snow</text></g>
    <g id="tile-heavy-snow"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-heavy-snow" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Heavy Snow</text></g>
    <g id="tile-fog"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-fog" x="44" y="14"/><text x="92" y="154" class="label" font-size="17">Fog</text></g>
    <g id="tile-haze"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-haze" x="44" y="16"/><text x="92" y="154" class="label" font-size="17">Haze</text></g>
    <g id="tile-wind"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-wind" x="44" y="30"/><text x="92" y="154" class="label" font-size="17">Wind</text></g>
    <g id="tile-extreme-rain"><rect width="184" height="184" rx="18" class="tile"/><use href="#icon-heavy-rain" x="44" y="22"/><text x="92" y="154" class="label" font-size="17">Extreme Rain</text></g>
  </defs>

  <rect width="1440" height="1180" fill="#f6f8fb"/>
  <text x="72" y="86" class="title" font-size="38">SkyPulse Weather Icon Draft - Flat Pass</text>
  <text x="72" y="124" class="meta" font-size="18">No shadow, no cloud highlight, no 3D volume. Rain uses fine diagonal strokes.</text>

  <g transform="translate(72 170)">
    <use href="#tile-clear-day" x="0" y="0"/>
    <use href="#tile-clear-night" x="216" y="0"/>
    <use href="#tile-partly-day" x="432" y="0"/>
    <use href="#tile-partly-night" x="648" y="0"/>
    <use href="#tile-cloudy" x="864" y="0"/>
    <use href="#tile-overcast" x="1080" y="0"/>
    <use href="#tile-drizzle" x="0" y="224"/>
    <use href="#tile-rain" x="216" y="224"/>
    <use href="#tile-heavy-rain" x="432" y="224"/>
    <use href="#tile-thunder" x="648" y="224"/>
    <use href="#tile-thunder-rain" x="864" y="224"/>
    <use href="#tile-sleet" x="1080" y="224"/>
    <use href="#tile-snow" x="0" y="448"/>
    <use href="#tile-heavy-snow" x="216" y="448"/>
    <use href="#tile-fog" x="432" y="448"/>
    <use href="#tile-haze" x="648" y="448"/>
    <use href="#tile-wind" x="864" y="448"/>
    <use href="#tile-extreme-rain" x="1080" y="448"/>
  </g>

  <g transform="translate(72 920)">
    <text x="0" y="0" class="title" font-size="20">Design notes</text>
    <text x="0" y="38" class="meta" font-size="17">This pass uses single-color cloud silhouettes and flat weather marks for a cleaner system-weather style.</text>
    <text x="0" y="70" class="meta" font-size="17">If the shape language is closer, the next pass can tune cloud proportion, color temperature, and day/night contrast.</text>
  </g>
</svg>
