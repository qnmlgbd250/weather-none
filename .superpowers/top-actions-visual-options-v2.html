<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyPulse 顶部按钮更多方案</title>
  <style>
    :root {
      --text-primary: rgba(255,255,255,1);
      --text-secondary: rgba(255,255,255,.85);
      --line: rgba(255,255,255,.24);
      --glass-top: rgba(255,255,255,.18);
      --glass-bottom: rgba(255,255,255,.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at 12% 0%, rgba(255,255,255,.16), transparent 28%),
        linear-gradient(160deg, #1565A0 0%, #2980C0 36%, #4A9BD5 68%, #6DB5E0 100%);
      padding: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: 0; }
    .hint { margin: 0 0 24px; color: rgba(255,255,255,.68); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      max-width: 1120px;
    }
    .panel {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0,0,0,.12);
    }
    .phone {
      padding: 20px;
      min-height: 230px;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.15), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .location {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 18px;
      min-width: 0;
    }
    .pin { width: 20px; height: 20px; opacity: .86; }
    .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon { width: 22px; height: 22px; display: block; color: var(--text-secondary); }
    .icon-small { width: 20px; height: 20px; }
    .temp {
      margin-top: 50px;
      text-align: center;
      font-size: 72px;
      font-weight: 200;
      color: rgba(255,255,255,.92);
    }
    .soft-btn {
      width: 44px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
    }
    .frost-btn {
      width: 42px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.22);
      background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 18px rgba(0,0,0,.08);
    }
    .wide-bar {
      width: 92px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.22);
      background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 18px rgba(0,0,0,.08);
    }
    .wide-bar > div {
      display: grid;
      place-items: center;
    }
    .wide-bar > div + div {
      border-left: 1px solid rgba(255,255,255,.14);
    }
    .underline-btn {
      width: 40px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      position: relative;
    }
    .underline-btn:after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 3px;
      height: 1px;
      border-radius: 1px;
      background: rgba(255,255,255,.38);
    }
    .body {
      padding: 18px 20px 20px;
      border-top: 1px solid rgba(255,255,255,.16);
    }
    .body h2 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
    .body p { margin: 0; color: rgba(255,255,255,.68); line-height: 1.55; font-size: 13px; }
  </style>
</head>
<body>
  <h1>更多顶部按钮方案</h1>
  <p class="hint">这组更注重“精致但不厚重”。我个人更偏 D 或 E。</p>
  <div class="grid">
    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="soft-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="13" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="4" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="13" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/></svg>
            </div>
            <div class="soft-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="18" cy="7" r="1.5" fill="currentColor"/><circle cx="10" cy="12" r="1.5" fill="currentColor"/><circle cx="14" cy="17" r="1.5" fill="currentColor"/></svg>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>D 柔光宽按钮</h2>
        <p>触控区最大，边框最少，像浮在背景上的轻按钮。很适合天气页，不会显得工具感太重。</p>
      </div>
    </section>
    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="frost-btn">
              <svg class="icon-small" viewBox="0 0 24 24" fill="none"><path d="M6 5h12a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 18 19H6a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 6 5Z" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 12h8M8 15h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </div>
            <div class="frost-btn">
              <svg class="icon-small" viewBox="0 0 24 24" fill="none"><path d="M5 8h14M7 12h10M9 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>E 细边霜玻璃按钮</h2>
        <p>最稳妥，按钮更精致，圆角 12dp，图标线条更细。城市列表图标更像“列表页”。</p>
      </div>
    </section>
    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="wide-bar">
              <div>
                <svg class="icon-small" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg>
              </div>
              <div>
                <svg class="icon-small" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.55" fill="currentColor"/><circle cx="12" cy="12" r="1.55" fill="currentColor"/><circle cx="12" cy="19" r="1.55" fill="currentColor"/></svg>
              </div>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>F 宽连体工具条</h2>
        <p>最整体，视觉上很高级。但两个动作合在一个控件里，右上角会更显眼。</p>
      </div>
    </section>
    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="underline-btn">
              <svg class="icon-small" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </div>
            <div class="underline-btn">
              <svg class="icon-small" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>G 极简下划线按钮</h2>
        <p>最轻巧，只增加触控宽度和底部细线。精致感克制，但提升没有 D/E 明显。</p>
      </div>
    </section>
  </div>
</body>
</html>
