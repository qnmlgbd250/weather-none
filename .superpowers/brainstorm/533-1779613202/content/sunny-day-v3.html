<h2>晴天日间 — 选择你的色调</h2>
<p class="subtitle">低饱和莫兰迪风格，保留蓝色色相</p>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0;">

  <div class="option" data-choice="a" onclick="toggleSelect(this)" style="padding: 0; overflow: hidden;">
    <div style="height: 200px; background: linear-gradient(180deg, #4A7FA5 0%, #6B9FC0 33%, #8DBDD5 66%, #B5D5E5 100%);"></div>
    <div style="padding: 12px 16px;">
      <h3 style="margin: 0 0 4px 0;">A. 静谧蓝</h3>
      <p style="margin: 0; font-size: 13px; opacity: 0.7;">保留天空蓝色相，降饱和处理</p>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)" style="padding: 0; overflow: hidden;">
    <div style="height: 200px; background: linear-gradient(180deg, #5A8BA5 0%, #7CA8BE 33%, #A0C2D2 66%, #C5D8E2 100%);"></div>
    <div style="padding: 12px 16px;">
      <h3 style="margin: 0 0 4px 0;">B. 湖水青</h3>
      <p style="margin: 0; font-size: 13px; opacity: 0.7;">偏青绿调，清冷中带暖意</p>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)" style="padding: 0; overflow: hidden;">
    <div style="height: 200px; background: linear-gradient(180deg, #6B8FAA 0%, #8BAABE 33%, #ABC1D0 66%, #C8D6DE 100%);"></div>
    <div style="padding: 12px 16px;">
      <h3 style="margin: 0 0 4px 0;">C. 灰调天蓝</h3>
      <p style="margin: 0; font-size: 13px; opacity: 0.7;">经典莫兰迪灰蓝，中性偏冷</p>
    </div>
  </div>

  <div class="option" data-choice="d" onclick="toggleSelect(this)" style="padding: 0; overflow: hidden;">
    <div style="height: 200px; background: linear-gradient(180deg, #5B8499 0%, #7DA2B5 33%, #9FBDCB 66%, #C0D4DD 100%);"></div>
    <div style="padding: 12px 16px;">
      <h3 style="margin: 0 0 4px 0;">D. 暮色蓝灰</h3>
      <p style="margin: 0; font-size: 13px; opacity: 0.7;">偏暖蓝灰，带一丝紫调</p>
    </div>
  </div>

</div>
