<h2>晴天日间配色方案</h2>
<p class="subtitle">莫兰迪风格 · 4 色多段渐变 · 选择你最喜欢的基调</p>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0;">

  <div data-choice="a" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #4A7FA5 0%, #6B9FC0 30%, #8DBDD5 65%, #B5D5E5 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">A. 静谧蓝</div>
      <div style="font-size: 13px; color: #86868b;">保留天空蓝色相，低饱和处理，清冷克制</div>
    </div>
  </div>

  <div data-choice="b" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #5A8BA5 0%, #7CA8BE 30%, #A0C2D2 65%, #C5D8E2 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">B. 湖水青</div>
      <div style="font-size: 13px; color: #86868b;">偏青绿调，像高原湖泊，清冷中带暖意</div>
    </div>
  </div>

  <div data-choice="c" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #6B8FAA 0%, #8BAABE 30%, #ABC1D0 65%, #C8D6DE 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">C. 灰调天蓝</div>
      <div style="font-size: 13px; color: #86868b;">经典莫兰迪灰蓝，灰感最明显，内敛优雅</div>
    </div>
  </div>

  <div data-choice="d" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #5B8499 0%, #7DA2B5 30%, #9FBDCB 65%, #C0D4DD 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">D. 暮色蓝灰</div>
      <div style="font-size: 13px; color: #86868b;">偏暖蓝灰带紫调，像日落前的天空</div>
    </div>
  </div>

</div>

<div style="display: flex; gap: 16px; align-items: center; margin-top: 8px; padding: 12px 16px; background: rgba(255,255,255,0.04); border-radius: 8px;">
  <span style="font-size: 13px; opacity: 0.5;">对比 →</span>
  <div style="height: 32px; flex: 1; background: linear-gradient(90deg, #1976D2, #64B5F6); border-radius: 6px;"></div>
  <span style="font-size: 12px; opacity: 0.4;">当前方案（饱和度更高）</span>
</div>
