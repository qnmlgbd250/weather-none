<h2>晴天日间 — 柔和但有色彩感</h2>
<p class="subtitle">不灰不闷，保留蓝色的生命力，4 段渐变增加层次</p>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0;">

  <div data-choice="a" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #3D8EB9 0%, #5DAAD4 25%, #7EC4E8 55%, #A8DAF2 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">A. 清透天蓝</div>
      <div style="font-size: 13px; color: #86868b;">比当前方案柔和，但仍然清澈通透，像高原的天空</div>
    </div>
  </div>

  <div data-choice="b" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #4B92B5 0%, #6AABCC 25%, #8CC1DD 55%, #B0D6EB 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">B. 柔雾蓝</div>
      <div style="font-size: 13px; color: #86868b;">微带灰调的柔蓝，像隔着一层薄雾看天空</div>
    </div>
  </div>

  <div data-choice="c" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #2E7DA8 0%, #4E99C4 25%, #72B5DB 55%, #9CCEED 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">C. 晴空蓝</div>
      <div style="font-size: 13px; color: #86868b;">更鲜艳一些，接近 iOS 天气 App 的晴天感</div>
    </div>
  </div>

  <div data-choice="d" onclick="toggleSelect(this)" style="border-radius: 12px; overflow: hidden; border: 2px solid #424245; cursor: pointer;">
    <div style="height: 220px; background: linear-gradient(180deg, #5B93AD 0%, #74A8BF 20%, #8EBCD0 50%, #ABD0E0 80%, #C5E0EC 100%);"></div>
    <div style="padding: 14px 16px; background: #2d2d2f;">
      <div style="font-weight: 600; margin-bottom: 4px;">D. 晨曦蓝</div>
      <div style="font-size: 13px; color: #86868b;">5 段渐变，从深到浅过渡最细腻，有清晨的宁静感</div>
    </div>
  </div>

</div>
