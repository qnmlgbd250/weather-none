<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyPulse 顶部按钮视觉对比</title>
  <style>
    :root {
      --text-primary: rgba(255,255,255,1);
      --text-secondary: rgba(255,255,255,.85);
      --line: rgba(255,255,255,.26);
      --glass-top: rgba(255,255,255,.20);
      --glass-bottom: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text-primary);
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0)),
        linear-gradient(160deg, #1565A0 0%, #2980C0 34%, #4A9BD5 66%, #6DB5E0 100%);
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .hint {
      margin: 0 0 24px;
      color: rgba(255,255,255,.68);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      max-width: 1120px;
    }
    .panel {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0,0,0,.12);
    }
    .phone {
      padding: 20px;
      min-height: 230px;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.16), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .location {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 18px;
      min-width: 0;
    }
    .pin { width: 20px; height: 20px; opacity: .86; }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon {
      width: 22px;
      height: 22px;
      display: block;
      color: var(--text-secondary);
    }
    .plain-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
    }
    .glass-btn {
      width: 40px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 6px 16px rgba(0,0,0,.08);
    }
    .pill {
      height: 34px;
      min-width: 76px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 6px 16px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .pill > div {
      height: 100%;
      display: grid;
      place-items: center;
    }
    .pill > div + div {
      border-left: 1px solid rgba(255,255,255,.16);
    }
    .body {
      padding: 18px 20px 20px;
      border-top: 1px solid rgba(255,255,255,.16);
    }
    .body h2 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 650;
    }
    .body p {
      margin: 0;
      color: rgba(255,255,255,.68);
      line-height: 1.55;
      font-size: 13px;
    }
    .temp {
      margin-top: 50px;
      text-align: center;
      font-size: 72px;
      font-weight: 200;
      color: rgba(255,255,255,.92);
    }
  </style>
</head>
<body>
  <h1>主页右上角按钮视觉对比</h1>
  <p class="hint">重点看：按钮是否更精致、触控区域是否更宽、和天气页玻璃感是否协调。</p>

  <div class="grid">
    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="plain-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </div>
            <div class="plain-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="19" r="1.7" fill="currentColor"/></svg>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>A 当前风格</h2>
        <p>最轻，但 32dp 触控区偏小，两个图标像直接摆在背景上，精致感弱。</p>
      </div>
    </section>

    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="glass-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg>
            </div>
            <div class="glass-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.55" fill="currentColor"/><circle cx="12" cy="12" r="1.55" fill="currentColor"/><circle cx="12" cy="19" r="1.55" fill="currentColor"/></svg>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>B 独立玻璃按钮</h2>
        <p>每个按钮加宽到 40×34dp，城市列表换成四宫格图标，更像入口按钮。推荐。</p>
      </div>
    </section>

    <section class="panel">
      <div class="phone">
        <div class="topbar">
          <div class="location">
            <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
            开平花园
          </div>
          <div class="actions">
            <div class="pill">
              <div>
                <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="5" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg>
              </div>
              <div>
                <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.55" fill="currentColor"/><circle cx="12" cy="12" r="1.55" fill="currentColor"/><circle cx="12" cy="19" r="1.55" fill="currentColor"/></svg>
              </div>
            </div>
          </div>
        </div>
        <div class="temp">28°</div>
      </div>
      <div class="body">
        <h2>C 连体胶囊按钮</h2>
        <p>最精致，也最“iOS 天气”。但存在两个入口挤在一起的感觉，误触边界需要处理好。</p>
      </div>
    </section>
  </div>
</body>
</html>
